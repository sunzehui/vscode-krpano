name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub Release
    env:
      # 在仓库 Settings → Secrets and variables → Actions 添加 VSCE_PAT(Marketplace → Manage 权限)
      # 未配置时只打包 + 建 GitHub Release,不发 Marketplace
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        run: |
          node -e "
            const version = require('./package.json').version
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '')
            if (version !== tag) {
              console.error('tag ' + tag + ' 与 package.json 的 ' + version + ' 不一致')
              process.exit(1)
            }
          "

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package vsix
        run: npx --yes @vscode/vsce package --out krpano-lang.vsix

      - name: Publish to Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --packagePath krpano-lang.vsix

      - name: Notice when VSCE_PAT is missing
        if: env.VSCE_PAT == ''
        run: echo "::notice::未配置 VSCE_PAT secret,已跳过 Marketplace 发布;配置命令:gh secret set VSCE_PAT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/changelog-notes.mjs > notes.md
          title="krpano-lang ${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # 重新推送同一个 tag 时:更新说明并覆盖附件
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" krpano-lang.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" krpano-lang.vsix --title "$title" --notes-file notes.md
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: krpano-lang.vsix
          if-no-files-found: error
