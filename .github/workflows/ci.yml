name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure git for Windows line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        shell: bash
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 打包依赖收集(vsce 内部走 npm)需要 npm 形态的 node_modules,因此 CI 用 npm 而非 pnpm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # 先构建:test/ 里的语言服务器冒烟测试会启动 dist/lsp/server.js
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # 覆盖率阈值只在 Linux 上卡(win32/posix 路径分支在不同平台上覆盖数略有差异)
      - name: Coverage (纯逻辑模块,带阈值)
        if: runner.os == 'Linux'
        run: npm run coverage

      - name: Coverage report (其它平台,不设阈值)
        if: runner.os != 'Linux'
        run: npm run coverage:report

      - name: Benchmark
        run: npm run bench

      # 真实 VS Code 集成测试:下载 VS Code 后加载扩展跑一遍端到端用例
      # (Linux 需要虚拟显示器;首次下载约 100MB,单独限时)
      - name: Integration test (真实 VS Code)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: xvfb-run -a npm run test:integration

      - name: Cache VS Code (for next runs)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: vscode-test-${{ runner.os }}-

      - name: Package vsix
        run: npx --yes @vscode/vsce package --out krpano-lang.vsix

      # 回归防线:产物必须自包含(0.3.0 曾因依赖没进包导致格式化失效)
      - name: Verify the package is self-contained
        shell: bash
        run: |
          unzip -l krpano-lang.vsix | grep -q 'extension/dist/extension.js'
          unzip -l krpano-lang.vsix | grep -q 'extension/dist/lsp/server.js'
          unzip -l krpano-lang.vsix | grep -q 'extension/dist/lsp/client.js'
          if unzip -l krpano-lang.vsix | grep -q 'extension/node_modules/'; then
            echo 'vsix 不应包含 node_modules:依赖应已被打包进 dist' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: krpano-lang.vsix
          if-no-files-found: error
